# Windows and Linux builds on GitHub's runners (the macOS build is signed and notarized locally).
# Run by hand from the Actions tab. With a release tag (e.g. v0.9.0) the files are attached to that
# release, which must already exist (a draft is fine); without one they are only kept as artifacts.
name: Build Windows and Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to (empty = artifacts only)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              release/*.exe
              release/*.exe.blockmap
          - os: ubuntu-latest
            target: --linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: canopus-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" ${{ matrix.os == 'windows-latest' && 'release/*.exe release/*.exe.blockmap' || 'release/*.AppImage release/*.deb' }} --clobber

  # After the builds: checksums of every file in the release (the macOS files included when they
  # were uploaded first), as SHA256SUMS.txt and as a table with VirusTotal links in the notes.
  checksums:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir files && cd files
          gh release download "$TAG" -R "$REPO" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum $(ls | grep -v blockmap) > SHA256SUMS.txt
          gh release upload "$TAG" -R "$REPO" SHA256SUMS.txt --clobber
          gh release view "$TAG" -R "$REPO" --json body --jq .body | sed '/^## Checksums/,$d' > notes.md
          {
            echo '## Checksums / Контрольные суммы'
            echo
            echo '| File | SHA-256 | |'
            echo '|---|---|---|'
            while read -r sum name; do echo "| \`$name\` | \`$sum\` | [VirusTotal](https://www.virustotal.com/gui/file/$sum) |"; done < SHA256SUMS.txt
          } >> notes.md
          gh release edit "$TAG" -R "$REPO" --notes-file notes.md
